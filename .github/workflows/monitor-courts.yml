name: Monitor court alerts

on:
  schedule:
    # Every 5 minutes (GitHub may delay on free tier; use workflow_dispatch for immediate runs)
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Poll court availability and send alert emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET repository secret"
            exit 1
          fi

          BASE="${SITE_URL:-https://www.playtennis.lt}"
          echo "Triggering monitor at ${BASE}/api/cron/monitor-courts"

          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/monitor-courts")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "$body"
          echo "HTTP ${http_code}"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
