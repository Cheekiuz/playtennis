name: Ingest ITF Masters calendar

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ingest-itf:
    runs-on: ubuntu-latest
    steps:
      - name: Sync ITF World Tennis Masters Tour calendar (batched)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing CRON_SECRET repository secret"
            exit 1
          fi

          BASE="${SITE_URL:-https://www.playtennis.lt}"
          OFFSET=0
          LIMIT=75

          for i in 1 2 3 4 5 6 7 8; do
            echo "=== batch offset=${OFFSET} limit=${LIMIT} ==="
            response=$(curl -sS -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              --max-time 320 \
              "${BASE}/api/cron/ingest-itf?offset=${OFFSET}&limit=${LIMIT}")

            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            echo "$body" | head -c 4000
            echo ""
            echo "HTTP ${http_code}"

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              exit 1
            fi

            NEXT=$(printf '%s' "$body" | python3 -c 'import json,sys; data=json.load(sys.stdin); nxt=data.get("itf",{}).get("nextOffset"); print("" if nxt is None else nxt)')
            if [ -z "$NEXT" ]; then
              echo "No further batches."
              break
            fi
            OFFSET="$NEXT"
            sleep 2
          done
