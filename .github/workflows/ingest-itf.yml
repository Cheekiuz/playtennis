name: Ingest ITF Masters calendar

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ingest-itf:
    runs-on: ubuntu-latest
    steps:
      - name: Sync ITF World Tennis Masters Tour calendar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET repository secret"
            exit 1
          fi

          BASE="${SITE_URL:-https://www.playtennis.lt}"
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/ingest-itf")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body" | head -c 8000
          echo ""
          echo "HTTP ${http_code}"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
